name: codeql

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: '0 22 * * 6'
    workflow_dispatch:

permissions: {}

concurrency:
    group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
    cancel-in-progress: true

jobs:
    analyze:
        name: Analyze
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # Matches onboard.qs and help-button.qs. The second clause skips pull
        # requests from forks: they get a read-only token, so security-events:
        # write is unavailable and the upload would fail as a broken check
        # rather than as the permission boundary it actually is.
        if: >-
            github.repository_owner == 'ptarmiganlabs' &&
            (github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.id == github.repository_id)
        permissions:
            actions: read
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                # 'javascript-typescript' is the current identifier; the bare
                # 'javascript' the other .qs repos use is a legacy alias for it.
                language: ['javascript-typescript']
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Initialize CodeQL
              uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
              with:
                  languages: ${{ matrix.language }}

            # No autobuild step: it is a no-op for JavaScript, which CodeQL
            # analyses directly from source.

            - name: Perform CodeQL analysis
              uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
