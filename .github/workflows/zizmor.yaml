# Static analysis of the workflows themselves — unpinned actions, injectable
# expressions, over-broad permissions.
name: zizmor

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions: {}

jobs:
    zizmor:
        name: Analyze workflows
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # Same guard as codeql-analysis.yaml: a fork's token cannot write
        # security events, so the SARIF upload would fail.
        if: >-
            github.repository_owner == 'ptarmiganlabs' &&
            (github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.id == github.repository_id)
        permissions:
            contents: read
            security-events: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

            # Pinned, and with no token. uvx fetches and executes this package
            # at run time, so an unpinned invocation runs whatever PyPI serves
            # that minute; zizmor needs a token only for its online audits, and
            # the workflow-file audits that matter here are all offline.
            - name: Run zizmor
              run: uvx zizmor@1.30.1 --format=sarif . > results.sarif

            - name: Upload SARIF
              uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
              with:
                  sarif_file: results.sarif
                  category: zizmor
