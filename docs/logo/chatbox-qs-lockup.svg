<svg xmlns="http://www.w3.org/2000/svg" width="364" height="116" viewBox="0 0 364 116" role="img" aria-labelledby="t">
  <title id="t">Chatbox.qs</title>
  <defs>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5477C"/>
      <stop offset="100%" stop-color="#A61B52"/>
    </linearGradient>
  </defs>

  <!-- No card behind the glyph: a lockup sits on whatever the page already is.
       The participant dots are ringed in white rather than the card tint, since
       there is no card here — on a light page the rings disappear and the dots
       simply read as three; on a dark one they read as outlined. -->
  <g transform="translate(8 10) scale(1.215) translate(-26 -18)">
    <path d="M40 18 H100 A14 14 0 0 1 114 32 V52 A14 14 0 0 1 100 66 H48 L26 80 V32
             A14 14 0 0 1 40 18 Z"
          fill="url(#iconGrad)"/>
    <rect x="40" y="32" width="58" height="6" rx="3" fill="#ffffff" opacity="0.95"/>
    <rect x="40" y="46" width="40" height="6" rx="3" fill="#ffffff" opacity="0.68"/>
    <circle cx="56" cy="88" r="9" fill="#4477AA" stroke="#ffffff" stroke-width="2.06"/>
    <circle cx="70" cy="88" r="9" fill="#CCBB44" stroke="#ffffff" stroke-width="2.06"/>
    <circle cx="84" cy="88" r="9" fill="#228833" stroke="#ffffff" stroke-width="2.06"/>
  </g>

  <text x="131" y="73" text-anchor="start"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="42" font-weight="600" fill="#A61B52">
